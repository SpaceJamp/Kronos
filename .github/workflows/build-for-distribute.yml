name: Build Kronos (unsigned)

on:
  push:
    tags:
      - v1.*
      - v2.*
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Check static_manifest.json is up to date
      shell: pwsh
      run: |
        # NOTE (fork): this check compares the bundled fallback manifest against the upstream
        # maintainer's manifest builder. It is informational only and never fails the build, so it
        # is kept for reference. Remove this step if you would rather not depend on that repo.
        $staticManifestPath = "src\Assets\static_manifest.json"
        $currentHash = Get-FileHash -Path $staticManifestPath -Algorithm SHA1

        if (-not $currentHash)
        {
          Write-Host "Could not get sha1 hash of $staticManifestPath"
          exit 1
        }

        $url = "https://raw.githubusercontent.com/beeradmoore/dlss-swapper-manifest-builder/refs/heads/main/manifest.json"
        $tempStaticManifestPath = Join-Path $env:TEMP "temp_static_manifest.json"

        try
        {
          Invoke-WebRequest -Uri $url -OutFile $tempStaticManifestPath
          $remoteHash = Get-FileHash -Path $tempStaticManifestPath -Algorithm SHA1

          if ($currentHash.Hash -eq $remoteHash.Hash) {
              Write-Host "static_manifest.json matches the upstream manifest."
          } else {
              Write-Host "static_manifest.json differs from the upstream manifest. Informational only."
          }
        }
        catch
        {
          Write-Host "Could not reach the upstream manifest builder, skipping comparison."
        }
      working-directory: ${{ github.workspace }}\
    
    # NOTE: the "Update static BuildInfo details" step used to live here, and rewriting
    # BuildInfo.cs to read its values from injected metadata broke it.
    #
    # It regex-substituted the literal source text "BuildTimestamp { get; }" and friends. Three of
    # its four patterns stopped matching the moment BuildInfo read from AssemblyMetadata instead of
    # from auto properties. The fourth still matched, as a substring of a line that already had an
    # initialiser, and produced:
    #
    #   public static DateTimeOffset? BuildTimestamp { get; } = 1759123456; = ParseTimestamp(...);
    #
    # which does not compile. The step had become a silent way to break the build.
    #
    # BuildInfo is now populated by the AddKronosBuildMetadata target in src/Kronos.csproj, which
    # writes AssemblyMetadata attributes and is read back at startup. The SDK fills SourceRevisionId
    # from the checkout on its own and the csproj stamps the timestamp, so neither needs doing here.
    # The branch and tag are the only values that have to be passed in, because MSBuild cannot run
    # git while evaluating properties, and both build scripts do that.

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.202'

    - name: Display .NET Info
      run: dotnet --info

    # Restore in locked mode before anything is built.
    #
    # The lock files are committed, and a plain restore would quietly update them instead of
    # failing, so without this the locks would drift on whoever's machine last built it and a broken
    # PackageReference pairing would only surface as an unrelated build error much later. --locked-mode
    # fails immediately and says what is wrong.
    #
    # The restore also runs the NuGet audit configured in the csproj, with mode "all" so transitive
    # packages are covered. Advisories come back as warnings rather than errors on purpose: a
    # transitive one inside a package we cannot update should not be able to block every build, which
    # is how a guard gets disabled. They are worth reading in this log.
    - name: Restore with the committed dependency lock
      run: dotnet restore src/Kronos.csproj --locked-mode
      working-directory: ${{ github.workspace }}

    # The test suite existed and was maintained, but nothing ran it. Everything above this point
    # could pass with a change that broke the app's own logic.
    #
    # Release rather than Debug, so this is testing what actually ships. The test project has no
    # UseWinUI, so it does not need the Windows App SDK runtime the app itself does.
    - name: Run tests
      run: dotnet test tests/Kronos.Tests/Kronos.Tests.csproj --configuration Release --nologo
      working-directory: ${{ github.workspace }}

    # docs/manifest.json is a committed copy of src/Assets/static_manifest.json, written by
    # package/update_manifest.cmd. Nothing checked that the copy was current, so the manifest the
    # site serves and the manifest embedded in the app could drift apart with no signal at all.
    #
    # The upstream check above only compares src/Assets against upstream, and is informational, so it
    # would not have caught this either.
    - name: Check docs manifest matches the bundled manifest
      shell: pwsh
      working-directory: ${{ github.workspace }}
      run: |
        $bundled = (Get-FileHash "src\Assets\static_manifest.json" -Algorithm SHA256).Hash
        $published = (Get-FileHash "docs\manifest.json" -Algorithm SHA256).Hash

        if ($bundled -ne $published)
        {
            Write-Host "docs/manifest.json does not match src/Assets/static_manifest.json"
            Write-Host "  bundled : $bundled"
            Write-Host "  published: $published"
            Write-Host "Run package\update_manifest.cmd and commit the result."
            exit 1
        }

        Write-Host "docs/manifest.json matches the bundled manifest."

    # Inno Setup replaced NSIS for the installer. ISCC.exe is installed per-user by winget, so the
    # per-user path is the one that exists on a GitHub runner. package_Installer.cmd checks the
    # machine-wide locations as well and does not need anything on PATH.
    - name: Install Inno Setup
      run: |
        winget install -e --id JRSoftware.InnoSetup --accept-package-agreements --accept-source-agreements
    - name: Extract version from csproj
      shell: pwsh
      run: |
        $ver = Select-String '<Version>(.+?)</Version>' "${{ github.workspace }}\src\Kronos.csproj" | % { $_.Matches[0].Groups[1].Value }
        echo "VERSION=$ver" >> $env:GITHUB_ENV
          
    - name: Build Kronos portable
      run: ${{ github.workspace }}\package\build_Portable.cmd
      working-directory: ${{ github.workspace }}\package\

    - name: Build Kronos installer
      run: ${{ github.workspace }}\package\build_Installer.cmd
      working-directory: ${{ github.workspace }}\package\
    
    # NOTE: Code signing was removed from this workflow.
    #
    # This is a fork. The original workflow submitted artifacts to SignPath using the upstream
    # project's organisation id, project slug and signing policy. Running that here would attempt to
    # sign with someone else's certificate configuration, so it has been deleted rather than
    # repointed. Releases from this fork are UNSIGNED.
    #
    # If you want signed builds, set up your own signing (a self-signed cert for local testing, or
    # your own HSM/cloud signing service) and add a step here. Do not reuse the upstream SignPath
    # identifiers.

    - name: Package Kronos portable
      run: ${{ github.workspace }}\package\package_Portable.cmd
      working-directory: ${{ github.workspace }}\package\

    - name: Upload portable build artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kronos-${{ env.VERSION }}-portable
        path: ${{ github.workspace }}\package\Output\Kronos-${{ env.VERSION }}-portable.zip
        if-no-files-found: error

    - name: Package Kronos installer
      run: ${{ github.workspace }}\package\package_Installer.cmd
      working-directory: ${{ github.workspace }}\package\

    - name: Upload installer build artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kronos-${{ env.VERSION }}-installer
        path: ${{ github.workspace }}\package\Output\Kronos-${{ env.VERSION }}-installer.exe
        if-no-files-found: error

