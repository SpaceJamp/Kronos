# Kronos's manifest site. These are static files served as-is.
#
# The manifest itself is a copy of src/Assets/static_manifest.json, written by
# package/update_manifest.cmd and committed. Nothing generates it at build time,
# and CI neither builds nor deploys this folder.
title: Kronos
description: DLL manifest and download links for Kronos.
repository: SpaceJamp/kronos-dlss-swapper

# Build tooling is not site content.
#
# Jekyll copies everything it is not told to skip, so compose.yaml and Dockerfile.alpine were being
# published alongside index.html and manifest.json. That serves the image recipe and the mount
# layout to anyone visiting the site.
#
# README.md is excluded because Jekyll would otherwise publish it and there is no README in docs/.
exclude:
  - compose.yaml
  - Dockerfile.alpine
  - Dockerfile.*
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

# No theme and no plugins.
#
# remote_theme: pages-themes/slate@v0.2.0 used to be configured here, along with
# jekyll-remote-theme, jekyll-default-layout and jekyll-optional-front-matter.
# None of them did anything: index.html carries no front matter, so no layout was
# ever applied, and _includes/head-custom.html is only reachable from a layout.
#
# They were still being installed, and jekyll-remote-theme's rubyzip < 3.0 pin is
# what held the dependency tree below a security fix. See docs/Gemfile.
#
# _includes/head-custom.html is left in place even though it is now unreachable,
# since removing it serves no purpose beyond tidying and would lose the favicon
# and manifest snippet it holds should a layout ever be introduced.
