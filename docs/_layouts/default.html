<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{ page.title | default: site.title }}</title>

        <!--
        Written for this site rather than pulled from a theme gem. The rationale for not
        reintroducing one lives in Gemfile, and is deliberately kept out of this file so it
        does not ship into the rendered page.
        -->
        <link rel="shortcut icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}" />
        <link rel="apple-touch-icon" sizes="180x180" href="{{ '/apple-touch-icon.png' | relative_url }}" />
        <link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32x32.png' | relative_url }}" />
        <link rel="icon" type="image/png" sizes="16x16" href="{{ '/favicon-16x16.png' | relative_url }}" />
        <link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}" />
    </head>
    <body>
        <main>
            {{ content }}
        </main>
    </body>
</html>
