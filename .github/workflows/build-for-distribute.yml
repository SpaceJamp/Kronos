name: Build Kronos (unsigned)

on:
  push:
    tags:
      - v1.*
      - v2.*
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Check static_manifest.json is up to date
      shell: pwsh
      run: |
        # NOTE (fork): this check compares the bundled fallback manifest against the upstream
        # maintainer's manifest builder. It is informational only and never fails the build, so it
        # is kept for reference. Remove this step if you would rather not depend on that repo.
        $staticManifestPath = "src\Assets\static_manifest.json"
        $currentHash = Get-FileHash -Path $staticManifestPath -Algorithm SHA1

        if (-not $currentHash)
        {
          Write-Host "Could not get sha1 hash of $staticManifestPath"
          exit 1
        }

        $url = "https://raw.githubusercontent.com/beeradmoore/dlss-swapper-manifest-builder/refs/heads/main/manifest.json"
        $tempStaticManifestPath = Join-Path $env:TEMP "temp_static_manifest.json"

        try
        {
          Invoke-WebRequest -Uri $url -OutFile $tempStaticManifestPath
          $remoteHash = Get-FileHash -Path $tempStaticManifestPath -Algorithm SHA1

          if ($currentHash.Hash -eq $remoteHash.Hash) {
              Write-Host "static_manifest.json matches the upstream manifest."
          } else {
              Write-Host "static_manifest.json differs from the upstream manifest. Informational only."
          }
        }
        catch
        {
          Write-Host "Could not reach the upstream manifest builder, skipping comparison."
        }
      working-directory: ${{ github.workspace }}\
    
    - name: Update static BuildInfo details
      shell: pwsh
      working-directory: ${{ github.workspace }}
      run: |
        $buildInfoFile = "${{ github.workspace }}\src\BuildInfo.cs"
        $gitTag = git describe --tags --exact-match
        $buildTimestamp = (Get-Date -UFormat %s)
        $gitCommit = (git rev-parse HEAD)
        $gitBranch = (git branch --show-current)
        $buildInfoContent = (Get-Content $buildInfoFile -Raw) 

        $buildInfoContent = $buildInfoContent -replace "GitBranch { get; } = string.Empty;", "GitBranch { get; } = `"$gitBranch`";"
        $buildInfoContent = $buildInfoContent -replace "GitCommit { get; } = string.Empty;", "GitCommit { get; } = `"$gitCommit`";"
        $buildInfoContent = $buildInfoContent -replace "BuildTimestamp { get; }", "BuildTimestamp { get; } = $buildTimestamp;"

        if ($gitTag)
        {
            $buildInfoContent = $buildInfoContent -replace "GitTag { get; } = string.Empty;", "GitTag { get; } = `"$gitTag`";"
        }

        Write-Output $buildInfoContent
        Set-Content -Path $buildInfoFile -Value $buildInfoContent

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.202'

    - name: Display .NET Info
      run: dotnet --info

    # Inno Setup replaced NSIS for the installer. ISCC.exe is installed per-user by winget, so the
    # per-user path is the one that exists on a GitHub runner. package_Installer.cmd checks the
    # machine-wide locations as well and does not need anything on PATH.
    - name: Install Inno Setup
      run: |
        winget install -e --id JRSoftware.InnoSetup --accept-package-agreements --accept-source-agreements
    - name: Extract version from csproj
      shell: pwsh
      run: |
        $ver = Select-String '<Version>(.+?)</Version>' "${{ github.workspace }}\src\Kronos.csproj" | % { $_.Matches[0].Groups[1].Value }
        echo "VERSION=$ver" >> $env:GITHUB_ENV
          
    - name: Build Kronos portable
      run: ${{ github.workspace }}\package\build_Portable.cmd
      working-directory: ${{ github.workspace }}\package\

    - name: Build Kronos installer
      run: ${{ github.workspace }}\package\build_Installer.cmd
      working-directory: ${{ github.workspace }}\package\
    
    # NOTE: Code signing was removed from this workflow.
    #
    # This is a fork. The original workflow submitted artifacts to SignPath using the upstream
    # project's organisation id, project slug and signing policy. Running that here would attempt to
    # sign with someone else's certificate configuration, so it has been deleted rather than
    # repointed. Releases from this fork are UNSIGNED.
    #
    # If you want signed builds, set up your own signing (a self-signed cert for local testing, or
    # your own HSM/cloud signing service) and add a step here. Do not reuse the upstream SignPath
    # identifiers.

    - name: Package Kronos portable
      run: ${{ github.workspace }}\package\package_Portable.cmd
      working-directory: ${{ github.workspace }}\package\

    - name: Upload portable build artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kronos-${{ env.VERSION }}-portable
        path: ${{ github.workspace }}\package\Output\Kronos-${{ env.VERSION }}-portable.zip
        if-no-files-found: error

    - name: Package Kronos installer
      run: ${{ github.workspace }}\package\package_Installer.cmd
      working-directory: ${{ github.workspace }}\package\

    - name: Upload installer build artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kronos-${{ env.VERSION }}-installer
        path: ${{ github.workspace }}\package\Output\Kronos-${{ env.VERSION }}-installer.exe
        if-no-files-found: error

