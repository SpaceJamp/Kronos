name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION: 'src/Kronos.sln'
  PROJECT: 'src/Kronos.csproj'

jobs:
  build-windows:
    name: Build Windows Portable
    runs-on: windows-latest
    outputs:
      artifact_path: ${{ steps.upload.outputs.artifact-path }}
      sha256: ${{ steps.sha256.outputs.hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.SOLUTION }}"

      - name: Build Windows Portable
        run: dotnet publish "${{ env.PROJECT }}" -c Release_Portable -f net10.0-windows10.0.26100.0 -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:PublishReadyToRunShowWarnings=true -o ./publish/win-x64

      - name: Create portable zip
        run: |
          cd ./publish/win-x64
          7z a -tzip -mx=9 ../../Kronos-${{ github.ref_name }}-portable.zip .

      - name: Calculate SHA256
        id: sha256
        run: |
          $hash = (Get-FileHash ./Kronos-${{ github.ref_name }}-portable.zip -Algorithm SHA256).Hash.ToLower()
          echo "hash=$hash" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: kronos-${{ github.ref_name }}-portable
          path: ./Kronos-${{ github.ref_name }}-portable.zip
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: kronos-${{ github.ref_name }}-portable
          path: ./

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: Kronos-${{ github.ref_name }}-portable.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SHA256
        run: |
          echo "${{ needs.build-windows.outputs.sha256 }}  Kronos-${{ github.ref_name }}-portable.zip" > Kronos-${{ github.ref_name }}-portable.zip.sha256
          gh release upload ${{ github.ref_name }} Kronos-${{ github.ref_name }}-portable.zip.sha256 --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}